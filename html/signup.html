<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Create Account</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <!-- Main Content with Background Books -->
    <main class="main-section position-relative">
        <!-- Left Book Illustration -->
        <div class="book-left position-absolute">
            <img src="../assets/orange-removebg-preview 1.png" alt="Orange book illustration" class="img-fluid">
        </div>
        
        <!-- Right Book Illustration -->
        <div class="book-right position-absolute">
            <img src="../assets/blue-removebg-preview 1.png" alt="Blue book illustration" class="img-fluid">
        </div>
        
        <!-- Bottom Right Book Illustration -->
        <div class="book-bottom-right position-absolute">
            <img src="../assets/1db9842ca0c65007896fa3f3140a4d49-removebg-preview 1.png" alt="Yellow book illustration" class="img-fluid">
        </div>

        <div class="container-fluid">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-md-6 col-lg-5 col-xl-4">
                    <div class="text-center mb-4">
                        <h2 class="signup-title">Create a new account</h2>
                    </div>

                    <form id="signupForm" action="profile-setup.html">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="username" placeholder="Choose a username" required/>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password <span class="required">*</span>
                            </label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" required/>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">
                                Confirm password <span class="required">*</span>
                            </label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password to confirm" required/>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="termsAccept"
                                    required
                                />
                                <label class="form-check-label" for="termsAccept">
                                    I accept to the Terms of Service, the Anti-spam policy and the Privacy Policy Accessibility info
                                </label>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-signup">Sign up</button>
                        </div>

                        <div class="text-center">
                            <span class="signin-text">Already got an account? </span>
                            <a href="login.html" class="signin-link">Sign in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/signup.js"></script>
</body>
</html>
