<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Complete Your Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/profile-setup.css">
    <script src="../js/profile-setup.js"></script>
</head>
<body>
    <!-- Main Content with Background Books -->
    <main class="main-section position-relative">
        <!-- Left Book Illustration -->
        <div class="book-left position-absolute">
            <img src="../assets/orange-removebg-preview 1.png" alt="Orange book illustration" class="img-fluid">
        </div>
        
        <!-- Right Book Illustration -->
        <div class="book-right position-absolute">
            <img src="../assets/blue-removebg-preview 1.png" alt="Blue book illustration" class="img-fluid">
        </div>
        
        <!-- Bottom Right Book Illustration -->
        <div class="book-bottom-right position-absolute">
            <img src="../assets/1db9842ca0c65007896fa3f3140a4d49-removebg-preview 1.png" alt="Yellow book illustration" class="img-fluid">
        </div>

        <div class="container-fluid">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-8 col-xl-7">
                    <div class="text-center mb-4">
                        <h1 class="profile-title">Fill your information</h1>
                        <p class="profile-subtitle">Please fill in all the fields.</p>
                    </div>

                    <form id="profileForm">
                        <div class="row">
                            <!-- Left Column -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">
                                        First Name <span class="required">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="firstName"
                                        placeholder="Enter your first name"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="lastName" class="form-label">
                                        Last Name <span class="required">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="lastName"
                                        placeholder="Enter your last name"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">
                                        Phone number <span class="required">*</span>
                                    </label>
                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="phoneNumber"
                                        placeholder="Enter your phone number"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">
                                        Email <span class="required">*</span>
                                    </label>
                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        placeholder="Enter your email"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>

                            <!-- Right Column -->
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="dateOfBirth" class="form-label">
                                        Date of Birth <span class="required">*</span>
                                    </label>
                                    <input
                                        type="date"
                                        class="form-control"
                                        id="dateOfBirth"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="country" class="form-label">
                                        Country <span class="required">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="country"
                                        placeholder="Enter your country"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="role" class="form-label">
                                        Choose your role <span class="required">*</span>
                                    </label>
                                    <select class="form-select" id="role" required>
                                        <option value="">Choose your role</option>
                                        <option value="student">Student</option>
                                        <option value="teacher">Teacher</option>
                                        <option value="researcher">Researcher</option>
                                        <option value="professional">Professional</option>
                                        <option value="other">Other</option>
                                    </select>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="school" class="form-label">
                                        School <span class="required">*</span>
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="school"
                                        placeholder="Enter your school/university"
                                        required
                                    />
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-submit">Submit</button>
                            </div>

                            <div>
                                <span class="back-text">Or back to </span>
                                <a href="signup.html" class="back-link">Sign up</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
