<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Account Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/personal-info.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="../assets/menubar logo.png" alt="Material Mate Logo">
            </a>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="#">Bookshop</a></li>
                <li><a href="#">Upload</a></li>
            </ul>
        </nav>
        
        <div class="user-profile">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name">Truong Quoc Khanh</span>
                <span class="user-credit">Credit: 01</span>
            </div>
            <div class="dropdown-menu">
                <div>
                    <a href="personal-info.html" class="dropdown-settings">Account Settings</a>
                </div>
                <div>
                    <a href="login.html" class="dropdown-logout">Log out</a>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <div class="container">
        <aside class="sidebar">
            <h1>ACCOUNT MANAGEMENT</h1>
            <ul class="sidebar-menu">
                <li class="active">
                    <a href="personal-info.html">
                        <i class="fas fa-info-circle"></i>
                        <span>PERSONAL INFORMATION</span>
                    </a>
                </li>
                <li>
                    <a href="uploaded-materials.html">
                        <i class="fas fa-upload"></i>
                        <span>UPLOADED MATERIALS</span>
                    </a>
                </li>
                <li>
                    <a href="exchanged-history.html">
                        <i class="fas fa-exchange-alt"></i>
                        <span>EXCHANGED HISTORY</span>
                    </a>
                </li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="profile-header">
                <div class="profile-picture">
                    <div class="edit-picture">
                        <i class="fas fa-user-edit"></i>
                    </div>
                </div>
                <h2 class="profile-name">Truong Quoc Khanh</h2>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" value="Quoc Khanh">
                </div>
                
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" value="Truong">
                </div>
                
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" value="ITCSIU23015">
                </div>
                
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" value="+84 38-485-xxxx">
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" value="ITCSIU23015@student.hcmiu.edu.vn">
                </div>
                
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" value="Vietnam">
                </div>
                
                <div class="form-group full-width">
                    <label>University</label>
                    <input type="text" value="International University - VNUHCM">
                </div>
            </div>
            
            <button class="edit-button">EDIT</button>
        </main>
    </div>
    
    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
