<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Upload Material</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/adminHandle/adload-page.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="../../assets/menubar logo.png" alt="Material Mate Logo">
            </a>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <nav>
            <ul>
                <li><a href="admin-home.html">Home</a></li>
                <li><a href="admin-blist.html">Bookshop</a></li>
                <li><a href="data.html">Data</a></li>
                <li><a href="adload-page.html" class="active">Upload</a></li>
                <li><a href="admin.html">Approving</a></li>
            </ul>
        </nav>
        
        <div class="user-profile">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name">Admin</span>
            </div>
            <div class="dropdown-menu">

                <div>
                    <a href="../../html/login.html" class="dropdown-logout">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="upload-title">UPLOAD MATERIAL</h1>
        
        <div class="upload-container" id="uploadContainer">
            <div class="upload-icon">
                <i class="fas fa-file-upload"></i>
            </div>
            <div class="upload-text">Drag your file here</div>
            <div class="upload-or">or</div>
            <button class="browse-btn" onclick="document.getElementById('fileInput').click()">
                Browse file
            </button>
            <input type="file" id="fileInput" class="file-input" accept=".pdf">
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">Material Mate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>
    <script src="../../js/adminHandle/adload-page.js"></script>
</body>
</html>
