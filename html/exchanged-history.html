<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Trao đổi - MaterialMate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/exchanged-history.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="../assets/menubar logo.png" alt="Material Mate Logo">
            </a>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="book-list.html">Bookshop</a></li>
                <li><a href="upload-page.html">Upload</a></li>
            </ul>
        </nav>
        
        <div class="user-profile">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name">Đang tải...</span>
                <span class="user-credit">Credit: N/A</span>
            </div>
            <div class="dropdown-menu">
                <div>
                    <a href="personal-info.html" class="dropdown-settings">Account Settings</a>
                </div>
                <div>
                    <a href="login.html" class="dropdown-logout">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <h1>ACCOUNT MANAGEMENT</h1>
                <ul class="sidebar-menu">
                    <li>
                        <a href="personal-info.html">
                            <i class="fas fa-info-circle"></i>
                            <span>PERSONAL INFORMATION</span>
                        </a>
                    </li>
                    <li>
                        <a href="uploaded-materials.html">
                            <i class="fas fa-upload"></i>
                            <span>UPLOADED MATERIALS</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="exchanged-history.html">
                            <i class="fas fa-exchange-alt"></i>
                            <span>EXCHANGED HISTORY</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <!-- Materials List -->
            <section class="materials-list">
                <div class="filter-bar">
                    <div class="filter-dropdown">
                        <button class="filter-btn" id="filterBtn">
                            <i class="fas fa-filter"></i> Filter by
                        </button>
                        <div class="filter-dropdown-content" id="filterDropdown">
                            <div class="filter-section">
                                <h4>Exchanged Date</h4>
                                <div class="filter-options">
                                    <label><input type="radio" name="date-filter" value="all" checked> All time</label>
                                    <label><input type="radio" name="date-filter" value="today"> Today</label>
                                    <label><input type="radio" name="date-filter" value="week"> This week</label>
                                    <label><input type="radio" name="date-filter" value="month"> This month</label>
                                    <label><input type="radio" name="date-filter" value="year"> This year</label>
                                </div>
                            </div>
                            <div class="filter-actions">
                                <button id="applyFilters">Apply</button>
                                <button id="resetFilters">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Material Items -->
                <div class="materials">
                    <!-- Content will be loaded by JS here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/user-info.js"></script>
    <script src="../js/exchanged-history.js"></script>
</body>
</html>
