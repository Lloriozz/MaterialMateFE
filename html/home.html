<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Exchange Educational Materials</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="../assets/menubar logo.png" alt="Material Mate Logo">
            </a>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="#">Bookshop</a></li>
                <li><a href="#">Upload</a></li>
            </ul>
        </nav>
        
        <div class="user-profile">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name">Truong Quoc Khanh</span>
                <span class="user-credit">Credit: 01</span>
            </div>
            <div class="dropdown-menu">
                <div>
                    <a href="PersonalInfo.html" class="dropdown-settings">Account Settings</a>
                </div>
                <div>
                    <a href="#" class="dropdown-logout">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container-fluid position-relative px-0">
            <!-- Hero Section -->
            <section class="hero d-flex flex-column justify-content-center align-items-center position-relative">
                <!-- Left Book Illustration -->
                <div class="book-left position-absolute">
                    <img src="../assets/orange-removebg-preview 1.png" alt="Orange book illustration" class="img-fluid">
                </div>
                
                <!-- Right Book Illustration -->
                <div class="book-right position-absolute">
                    <img src="../assets/blue-removebg-preview 1.png" alt="Blue book illustration" class="img-fluid">
                </div>
                
                <!-- Bottom Right Book Illustration -->
                <div class="book-bottom-right position-absolute">
                    <img src="../assets/1db9842ca0c65007896fa3f3140a4d49-removebg-preview 1.png" alt="Yellow book illustration" class="img-fluid">
                </div>
                
                <!-- Center Book Stack -->
                <div class="book-stack text-center mb-4">
                    <img src="../assets/Material_Mate-removebg-preview 3.png" alt="Stack of books" class="img-fluid">
                </div>
                
                <!-- Welcome Text -->
                <h1 class="display-5 fw-bold">Welcome to <span class="text-orange">MaterialMate!</span></h1>
                <h2 class="fs-3 fw-normal mt-3">The best website for <span class="text-primary">exchanging materials</span></h2>
                <p class="fs-5 fst-italic mt-3">"A material a day keeps a person awake"</p>
                
                <!-- CTA Button -->
                <div class="mt-5">
                    <a href="#" class="btn btn-orange btn-lg rounded-pill px-4 py-3 fw-semibold">Exchange now!</a>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="../js/home.js"></script>
</body>
</html>
