<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="../assets/menubar logo.png" alt="Material Mate Logo">
            </a>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <nav>
            <ul>
                <li><a href="home.html" class="active">Home</a></li>
                <li><a href="book-list.html">Bookshop</a></li>
                <li><a href="upload-page.html">Upload</a></li>
            </ul>
        </nav>
        
        <div class="user-profile">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name">Username</span>
                <span class="user-credit"></span>
            </div>
            <div class="dropdown-menu">
                <div>
                    <a href="personal-info.html" class="dropdown-settings">Account Settings</a>
                </div>
                <div>
                    <a href="login.html" class="dropdown-logout">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="main-container">
            <!-- Hero Section -->
            <section class="hero">
                <!-- Left Book Illustration -->
                <div class="book-left">
                    <img src="../assets/orange-removebg-preview 1.png" alt="Orange book illustration">
                </div>
                
                <!-- Right Book Illustration -->
                <div class="book-right">
                    <img src="../assets/blue-removebg-preview 1.png" alt="Blue book illustration">
                </div>
                
                <!-- Bottom Right Book Illustration -->
                <div class="book-bottom-right">
                    <img src="../assets/1db9842ca0c65007896fa3f3140a4d49-removebg-preview 1.png" alt="Yellow book illustration">
                </div>
                
                <!-- Center Book Stack -->
                <div class="book-stack">
                    <img src="../assets/Material_Mate-removebg-preview 3.png" alt="Stack of books">
                </div>
                
                <!-- Welcome Text -->
                <h1 class="welcome-title">Welcome to <span class="text-orange">MaterialMate!</span></h1>
                <h2 class="welcome-subtitle">The best website for <span class="text-primary">exchanging materials</span></h2>
                <p class="welcome-quote">"A material a day keeps a person awake"</p>
                
                <!-- CTA Button -->
                <div class="cta-container">
                    <a href="book-list.html" class="btn-orange">Exchange now!</a>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>

    <!-- Custom JavaScript -->
    <script src="../js/home.js"></script>
    <script src="../js/user-info.js"></script>
</body>
</html>
