<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialMate - Account Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/personal-info.css">
    <script src="../js/personal-info.js"></script>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="home.html">
                <img src="../assets/menubar logo.png" alt="Material Mate Logo">
            </a>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search">
            <button type="submit">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="book-list.html">Bookshop</a></li>
                <li><a href="upload-page.html">Upload</a></li>
            </ul>
        </nav>
        
        <div class="user-profile">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name" id="headerUserName"></span>
                <span class="user-credit" id="headerUserCredit">Credit: 0</span>
            </div>
            <div class="dropdown-menu">
                <div>
                    <a href="personal-info.html" class="dropdown-settings">Account Settings</a>
                </div>
                <div>
                    <a href="login.html" class="dropdown-logout">Log out</a>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Success Notification -->
    <div class="notification-overlay" id="successNotification">
        <div class="notification-popup">
            <div class="notification-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 class="notification-title">Profile updated successfully!</h3>
            <button class="notification-button" id="notificationCloseBtn">Close</button>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="container">
        <aside class="sidebar">
            <h1>ACCOUNT MANAGEMENT</h1>
            <ul class="sidebar-menu">
                <li class="active">
                    <a href="personal-info.html">
                        <i class="fas fa-info-circle"></i>
                        <span>PERSONAL INFORMATION</span>
                    </a>
                </li>
                <li>
                    <a href="uploaded-materials.html">
                        <i class="fas fa-upload"></i>
                        <span>UPLOADED MATERIALS</span>
                    </a>
                </li>
                <li>
                    <a href="exchanged-history.html">
                        <i class="fas fa-exchange-alt"></i>
                        <span>EXCHANGED HISTORY</span>
                    </a>
                </li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="profile-header">
                <div class="profile-container">
                    <div class="profile-picture" id="profilePicture">
                        <img id="profileImage" src="../assets/menubar logo.png" alt="Profile Picture">
                    </div>
                    <button class="edit-picture" id="editPictureBtn">
                        <i class="fas fa-plus"></i>
                    </button>
                    <input type="file" id="profilePictureInput" accept="image/*" style="display: none;">
                </div>
                <h2 class="profile-name"></h2>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" readonly required>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" readonly required>
                </div>
                
                <div class="form-group">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" placeholder="First Name" readonly required>
                </div>
                
                <div class="form-group">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" placeholder="Last Name" readonly required>
                </div>
                
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="text" placeholder="Phone Number" readonly required>
                </div>
                
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" placeholder="Email" readonly required>
                </div>
                
                <div class="form-group">
                    <label>Country <span class="required">*</span></label>
                    <input type="text" placeholder="Country" readonly required>
                </div>
                
                <div class="form-group">
                    <label>University <span class="required">*</span></label>
                    <input type="text" placeholder="University" readonly required>
                </div>
            </div>
            
            <div class="button-container">
                <button class="edit-button" id="editButton">EDIT</button>
                <button class="save-button" id="saveButton">SAVE</button>
                <button class="discard-button" id="discardButton">DISCARD</button>
            </div>
        </main>
    </div>
    
    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <div class="footer-logo">MaterialMate</div>
            
            <div class="footer-contact">
                <div class="footer-contact-item">
                    <i class="fas fa-phone"></i>
                    <span>+84 43-036-79xx</span>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-envelope"></i>
                    <a href="mailto:mm.work@gmail.com">mm.work@gmail.com</a>
                </div>
                
                <div class="footer-contact-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>International University</span>
                </div>
            </div>
        </div>
        
        <div class="footer-right">
            <h3>Follow us</h3>
            <div class="social-icons">
                <div class="social-icon">
                    <i class="fab fa-linkedin-in"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-twitter"></i>
                </div>
                <div class="social-icon">
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/user-info.js"></script>

</body>
</html>
